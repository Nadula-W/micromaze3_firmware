[platformio]
default_envs = esp32-s3

; ---------------------------------------------------------------------------
; DEVELOPMENT build used while tuning the robot.
; ESP32-S3 Wi-Fi AP + browser terminal is ENABLED.
; ---------------------------------------------------------------------------
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; Lower upload speed is intentionally used because this board previously showed
; checksum errors at very high flashing speeds.
upload_speed = 57600
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMM3_DEV_WIFI=1

lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.5
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.15

; ---------------------------------------------------------------------------
; COMPETITION build.
; Wi-Fi/BLE are NOT initialized and are explicitly shut down at boot.
; Flash this environment before inspection/competition.
; ---------------------------------------------------------------------------
[env:esp32-s3-competition]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 57600
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMM3_DEV_WIFI=0

lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.5
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.15
